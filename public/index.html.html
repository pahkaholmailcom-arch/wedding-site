<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Наша свадьба 💍</title>
</head>
<body style="font-family: Arial; text-align:center; background:#fff0f5;">

  <h1 style="margin-top:40px;">💍 Наша свадьба</h1>

  <h2 id="timer"></h2>

  <p>Мы будем рады видеть вас на нашем празднике!</p>

  <a href="/guest_form.html">
    <button style="padding:10px 20px; font-size:16px;">Ответить</button>
  </a>

  <br><br>

  <a href="/guest_list.html">
    <button style="padding:10px 20px;">Список гостей</button>
  </a>

  <script>
    const weddingDate = new Date("2026-06-05T12:00:00");

    function updateTimer() {
      const now = new Date();
      const diff = weddingDate - now;

      const timer = document.getElementById("timer");

      if (diff <= 0) {
        timer.innerText = "💍 Сегодня наш день!";
        return;
      }

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((diff / (1000 * 60)) % 60);

      timer.innerText = `До свадьбы: ${days} дн. ${hours} ч. ${minutes} мин. 💖`;
    }

    setInterval(updateTimer, 1000);
    updateTimer();
  </script>

</body>
</html>
