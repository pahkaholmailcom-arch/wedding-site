<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Дорогие гости</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body {
    background-image: url('photo.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
}

.card {
    background-color: rgba(255, 255, 255, 0.85);
}
</style>
</head>

<body class="container mt-5">

<h1 class="mb-4 text-uppercase fw-bold display-4 text-center text-dark">
  Дорогие гости
</h1>

<div class="card p-4 mx-auto" style="max-width: 500px;">
  <h4 class="mb-3">Уделите нам одну минутку</h4>

  <form id="rsvpForm">

    <div class="mb-3">
      <label class="form-label">
        1) Укажите Ваши имена (если пара/семья — всех):
      </label>
      <input type="text" id="allNames" class="form-control" placeholder="Иван, Мария" required>
    </div>

    <div class="mb-3">
      <label class="form-label">2) Присутствие на свадьбе:</label>
      <select id="attendance" class="form-select" required>
        <option value="">Выберите</option>
        <option value="Присутствую/присутствуем">Подтверждаю присутствие</option>
        <option value="Не смогу/не сможем">К сожалению, не смогу/не сможем</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">3) Трансфер:</label>
      <select id="transfer" class="form-select">
        <option value="">Выберите</option>
        <option value="Самостоятельно">Самостоятельно</option>
        <option value="На трансфере">На трансфере</option>
      </select>
    </div>

    <button type="submit" class="btn btn-primary w-100">
      Отправить
    </button>

  </form>
</div>

<script>
const form = document.getElementById('rsvpForm');

form.addEventListener('submit', async (e) => {
  e.preventDefault();

  const allNames = document.getElementById('allNames').value;
  const attendance = document.getElementById('attendance').value;
  const transfer = document.getElementById('transfer').value;

  try {
    await fetch('https://script.google.com/macros/s/AKfycbwSh_bDmSK-f-kns_QG0skYryzD9Hx9vow6h-Nir5qUrEe9Zpeu7p5ahNcbw225xMwE/exec', {
  method: 'POST',
  body: new URLSearchParams({
    allNames,
    attendance,
    transfer
  })
});

    alert("Спасибо! Ответ отправлен 💖");
    form.reset();

  } catch (error) {
    alert("Ошибка отправки 😢");
  }
});
</script>

</body>
</html>
